<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>屿宁学习助手</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/log.css">
<link rel="stylesheet" href="css/modal.css">
</head>
<body>
  <div class="app">
    <!-- AI banner + 工具栏 -->
    <div class="ai-banner warn" id="ai-banner">
      <span class="ai-banner-icon">●</span>
      <span class="ai-banner-text">未接入 AI 模型</span>
      <span class="ai-banner-action">点击接入 →</span>
      <div class="banner-tools" id="banner-tools">
        <span class="status-dot" id="status-dot" title="空闲"></span>
        <button class="icon-btn" id="refresh" title="重新扫描">↻</button>
        <button class="icon-btn" id="settings" title="设置">⚙</button>
      </div>
    </div>

    <!-- 睡眠标签页引导 -->
    <div class="guide-banner" id="sleep-banner" style="display:none;">
      <span class="guide-banner-icon">!</span>
      <span class="guide-banner-text">建议关闭浏览器睡眠标签页</span>
      <button class="guide-banner-btn" id="sleep-banner-btn">查看</button>
      <button class="guide-banner-close" id="sleep-banner-close" title="不再提示">×</button>
    </div>

    <!-- 主体（不滚动，各卡片自己滚动） -->
    <main class="app-body">
      <!-- 课程目录 -->
      <section class="card card-catalog">
        <div class="card-header">
          <span class="card-title">课程目录</span>
          <span class="card-stat" id="catalog-stat"></span>
        </div>
        <div class="card-body" id="catalog"><div class="empty">加载中…</div></div>
      </section>

      <!-- 本节任务点 -->
      <section class="card card-jobs">
        <div class="card-header">
          <span class="card-title">本节任务点</span>
          <span class="card-stat" id="jobs-stat"></span>
        </div>
        <div class="card-body" id="jobs"><div class="empty">未扫描</div></div>
      </section>

      <!-- AI 答题 -->
      <section class="card card-quiz">
        <div class="card-header">
          <span class="card-title">AI 答题</span>
          <span class="card-stat" id="quiz-stat"></span>
        </div>
        <div class="card-body quiz-body">
          <div id="quiz-empty" class="empty">打开答题页面后自动识别</div>
          <div id="quiz-ready" class="quiz-ready" style="display:none;">
            <button class="btn btn-primary quiz-btn" id="one-click">
              <span class="quiz-btn-icon">⚡</span>
              <span class="quiz-btn-label">一键答题</span>
              <span class="quiz-btn-sub">自动识别 + 自动填入</span>
            </button>
            <button class="quiz-detail-btn" id="quiz-detail" title="查看题目详情">
              <span id="quiz-detail-count">共 0 题</span>
              <span class="quiz-detail-arrow">▸</span>
            </button>
          </div>
        </div>
      </section>
    </main>

    <!-- 日志（固定高度） -->
    <section class="log-card" id="log-card">
      <div class="log-header">
        <span class="log-title">日志</span>
        <div class="log-actions">
          <button class="mini-btn" id="log-toggle">展开</button>
          <button class="mini-btn" id="log-clear">清空</button>
        </div>
      </div>
      <div id="log" class="log"></div>
    </section>

    <!-- Footer -->
    <footer class="app-footer">
      <button id="start" class="btn btn-primary">开始刷课</button>
      <button id="pause" class="btn btn-secondary" disabled>暂停</button>
      <button id="stop" class="btn btn-danger" disabled>停止</button>
    </footer>
  </div>

  <script src="modules/utils.js"></script>
  <script src="modules/storage.js"></script>
  <script src="modules/ai.js"></script>
  <script src="modules/render.js"></script>
  <script src="modules/scan.js"></script>
  <script src="modules/quiz.js"></script>
  <script src="modules/settings.js"></script>
  <script src="modules/status.js"></script>
  <script src="modules/guide.js"></script>
  <script src="modules/task.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
